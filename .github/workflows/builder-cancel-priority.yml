name: Priority Builder cancel snapshot
on:
  push:
    branches: [fix/builder-cancel-priority-20261101]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  warehouse-cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build playable Fabric 26.2 mod and run unit tests
        run: gradle --no-daemon build -x runGameTest
      - name: Run physical warehouse cancellation GameTest
        run: |
          python3 - <<'PYTEST'
          import json
          from pathlib import Path
          p=Path('src/gametest/resources/fabric.mod.json')
          data=json.loads(p.read_text())
          data['entrypoints']['fabric-gametest']=[
            'com.caszgamermd.caszualadditions.racks.BuilderCancelOverrideGameTest'
          ]
          p.write_text(json.dumps(data,indent=2)+'\n')
          PYTEST
          gradle --no-daemon runGameTest
      - name: Publish physical JAR snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar' -type f ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then printf 'Expected one playable JAR, got %s\n' "${#jars[@]}"; exit 1; fi
          cp "${jars[0]}" dist/caszual-additions-0.1.15-builder-cancel-override.jar
          sha256sum dist/*.jar > dist/SHA256SUMS.txt
          gh release create "warehouse-cancel-${GITHUB_SHA:0:12}" dist/*.jar dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Caszual Additions warehouse cancel override test" \
            --notes "Fabric 26.2. Stop queued and active Builder picking immediately, physically return in-flight cargo, retain packed shulkers on output pallet. Paired updated Golems Plus required."
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: caszual-additions-priority-builder-cancel
          if-no-files-found: error
          path: dist/
