name: Build

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify HeadDB head-search API (nonblocking)
        continue-on-error: true
        run: python3 scripts/head_db_api_smoke.py
      - name: Verify lossless Pallet Jack rack-to-rack pickup and unload
        run: python3 scripts/warehouse_pallet_jack_rack_transfer_smoke.py
      - name: Verify mail routing, atomic full-box rejection and personal PO Box data
        run: python3 scripts/mail_system_smoke.py
      - name: Check green INPUT receiving and red OUTPUT shipping aisles
        run: python3 scripts/warehouse_input_aisle_priority_smoke.py
      - name: Check Scanner unlink/relink, Pallet Dispenser floor and Pallet Jack cargo
        run: python3 scripts/warehouse_scanner_dispenser_jack_smoke.py
      - name: Check wooden pallet 3x3 JEI sample using any planks
        run: python3 scripts/wooden_pallet_jei_preview_smoke.py
      - name: Verify XP Charger WAILA/Jade progress tooltip and optional registration
        run: python3 scripts/xp_charger_jade_tooltip_smoke.py
      - name: Verify XP Drain crouch transfers, hardware art and Collector localization (blocking)
        run: python3 scripts/xp_drain_collector_charger_smoke.py
      - name: Verify clipboard, collapsed scaffold placement, and owner-death Golem wait
        run: python3 scripts/warehouse_clipboard_scaffold_death_wait_smoke.py
      - name: Verify Industrial Paint, primer, brush and coating lifecycle
        run: python3 scripts/industrial_paint_smoke.py
      - name: Verify four-Golem forward carry formation and supported-foot pallet tilt
        run: python3 scripts/warehouse_pallet_terrain_gait_smoke.py
      - name: Verify 3D pallet cargo hitbox and tool interactions
        run: python3 scripts/warehouse_ground_pallet_cargo_hitbox_smoke.py
      - name: Verify Rack Computer pickaxe mining and self-drop
        run: python3 scripts/warehouse_rack_computer_pickaxe_drop_smoke.py
      - name: Verify first-person cosmetic arms replace the vanilla hand
        run: python3 scripts/first_person_cosmetic_arm_replacement_smoke.py
      - name: Audit all block and item models for coplanar faces (blocking)
        run: python3 scripts/model_zfight_audit.py
      - name: Audit rotated and connected Rack Stairs for overlapping faces (blocking)
        run: python3 scripts/warehouse_stair_zfight_audit.py
      - name: Verify warehouse visual and network foundations (blocking)
        run: python3 scripts/warehouse_foundations_smoke.py
      - name: Verify compact trigger-free handheld Warehouse Scanner (blocking)
        run: python3 scripts/warehouse_scanner_model_smoke.py
      - name: Verify Industrial Grade Concrete and Golem console (blocking)
        run: python3 scripts/warehouse_igc_golems_smoke.py
      - name: Verify Storage Golem robot texture and joined head models (blocking)
        run: python3 scripts/warehouse_golem_robot_texture_smoke.py
      - name: Verify shelf uses same real Golem model and texture (blocking)
        run: python3 scripts/warehouse_shelf_golem_texture_smoke.py
      - name: Verify free-standing pallet access and rack front grill (blocking)
        run: python3 scripts/warehouse_pallet_access_frame_smoke.py
      - name: Verify portable wrapping and shared four-Golem pallet carry (blocking)
        run: python3 scripts/warehouse_portable_carry_smoke.py
      - name: Verify one moving pallet with four attached Golems (blocking)
        run: python3 scripts/warehouse_single_entity_pallet_smoke.py
      - name: Verify metal gear recycling recipe overrides (blocking)
        run: python3 scripts/metal_gear_recycling_smoke.py
      - name: Verify Fun Barrel shared Caszual tag discovery (blocking)
        run: python3 scripts/fun_barrel_tag_smoke.py
      - name: Verify flat Golem return routes (blocking)
        run: python3 scripts/warehouse_flat_home_return_smoke.py
      - name: Verify Scanner rack-to-Golem pickup and lossless transfer (blocking)
        run: python3 scripts/warehouse_rack_pickup_smoke.py
      - name: Verify carrying pose, follow distance, delivery, and shared-shelf docking (blocking)
        run: python3 scripts/warehouse_carry_follow_delivery_smoke.py
      - name: Verify rack insertion animation, rigid carrier and 3D wrapper (blocking)
        run: python3 scripts/warehouse_reverse_insert_wrapper_smoke.py
      - name: Verify multi-item orders, 9-slot Golems and Shulker Station (blocking)
        run: python3 scripts/warehouse_station_orders_smoke.py
      - name: Check Golem routing, tasks and three-wide rack aisle (blocking)
        run: python3 scripts/warehouse_golem_route_and_aisle_smoke.py
      - name: Verify Anti-Warden armor, silence and trap behavior (blocking)
        run: python3 scripts/anti_warden_smoke.py
      - name: Verify wool earmuffs/slippers, active Warden sound suppression and placed XP collector
        run: python3 scripts/wool_trap_ground_xp_smoke.py
      - name: Verify unregistered modded footsteps never crash Warden Trap sound filtering
        run: python3 scripts/warden_trap_unregistered_sound_smoke.py
      - name: Verify Caszual creative tab de-duplicates all items (blocking)
        run: python3 scripts/creative_tab_dedup_smoke.py
      - name: Verify saved order drafts, shelf docking and durable pallet assignments (blocking)
        run: python3 scripts/warehouse_order_draft_delivery_smoke.py
      - name: Verify shelf doors, cargo visuals, clipboard filter and pallet magazine (blocking)
        run: python3 scripts/warehouse_shelf_cargo_filter_stack_smoke.py
      - name: Verify partial blocks use protective cardboard on ground and rack pallets
        run: python3 scripts/warehouse_partial_block_cargo_box_smoke.py
      - name: Verify queued remote recovery, complete cargo handoff and Shulker Station UI
        run: python3 scripts/warehouse_remote_exchange_shulker_smoke.py
      - name: Verify warehouse UI, global highlight, recall and Hopper Adapter direction (blocking)
        run: python3 scripts/warehouse_ui_hopper_regression.py
      - name: Verify placeable pallet magazine, job persistence and flat-first Golem paths (blocking)
        run: python3 scripts/warehouse_pallet_stacks_navigation_smoke.py
      - name: Verify Golems and pallet rigs route around even low or empty pallet stacks
        run: python3 scripts/warehouse_pallet_stack_pathfinding_smoke.py
      - name: Verify warehouse-first Builder order queue and visibility (blocking)
        run: python3 scripts/warehouse_builder_pending_queue_smoke.py
      - name: Verify OUTPUT-mode pallet setup and clearance diagnostics (blocking)
        run: python3 scripts/warehouse_ptp_output_clearance_smoke.py
      - name: Verify PTP pallet pickup and physical 2x2 magazine (blocking)
        run: python3 scripts/warehouse_ptp_pickup_2x2_magazine_smoke.py
      - name: Verify Parking Bay four-Golem pickup has no replacement while REMOTE exchange remains intact
        run: python3 scripts/warehouse_drone_bay_four_workers_smoke.py
      - name: Verify two-Golem Pallet Transfer Node pushing and both four-Golem pickup modes
        run: python3 scripts/warehouse_node_two_pushers_smoke.py
      - name: Verify synchronized three-Golem lift and empty-pallet courier
        run: python3 scripts/warehouse_remote_two_party_smoke.py
      - name: Verify THREE real independent outbound remote Golems before lift
        run: python3 scripts/warehouse_remote_independent_walkers_smoke.py
      - name: Verify courier's reachable full-width pallet route and anti-orbit waypoint persistence
        run: python3 scripts/warehouse_remote_courier_navigation_smoke.py
      - name: Verify courier departure clearance and no dancing pickup trio
        run: python3 scripts/warehouse_remote_crew_deadlock_smoke.py
      - name: Verify parallel full-size warehouse crews and scanner queue (blocking)
        run: python3 scripts/warehouse_parallel_remote_crews_smoke.py
      - name: Verify crafting vending machine recipe, storage and atomic batch safety (blocking)
        run: python3 scripts/crafting_vending_machine_smoke.py

      - name: Verify Suite discovery, Input-rack recovery and forklift operator lifecycle (blocking)
        run: python3 scripts/caszual_visibility_forklift_input_smoke.py

      - name: Verify Warehouse Scanner four modes, forklift handoffs and computer naming (blocking)
        run: python3 scripts/warehouse_scanner_four_modes_smoke.py

      - name: Verify two-block sorting reach and Golem-driven forklift safety (blocking)
        run: python3 scripts/warehouse_forklift_reach_smoke.py
      - name: Verify Golem seat inside moving forklift and safe autonomous job driving
        run: python3 scripts/warehouse_forklift_seat_drive_smoke.py
      - name: Verify forklift low pallet travel, 4m/s, lowered seat and park-before-dismiss
        run: python3 scripts/warehouse_forklift_seat_speed_cargo_parking_smoke.py
      - name: Verify centered forklift seat and physical four-blocks-per-second motor
        run: python3 scripts/warehouse_forklift_center_physical_speed_smoke.py
      - name: Verify forklift pallet ahead of mast and forward-facing pickup/drop-off
        run: python3 scripts/warehouse_forklift_forward_forks_and_alignment_smoke.py
      - name: Verify forklift unblocked travel and stranded operator recovery
        run: python3 scripts/warehouse_forklift_stuck_recovery_smoke.py
      - name: Verify forklift operations inside three-block warehouse aisles
        run: python3 scripts/warehouse_forklift_three_block_aisles_smoke.py
      - name: Verify forklift source destination selection and saved cargo safety
        run: python3 scripts/warehouse_forklift_selection_cargo_smoke.py
      - name: Verify around-rack forklift route and centered pallet docking
        run: python3 scripts/warehouse_forklift_aisle_routing_docking_smoke.py
      - name: Verify detailed forklift model, centered seat and Golem steering attachment
        run: python3 scripts/warehouse_forklift_premium_model_seat_anchor_smoke.py
      - name: Verify smooth forklift motion, rearward driver seat and z-clipping fixes
        run: python3 scripts/warehouse_forklift_smooth_drive_geometry_smoke.py
      - name: Verify forklift stable segment motor and actual speed telemetry
        run: python3 scripts/warehouse_forklift_stable_motor_smoke.py
      - name: Verify swept 90-degree forklift rack entry and safe fork-height changes
        run: python3 scripts/warehouse_forklift_swept_rack_maneuver_smoke.py
      - name: Verify loaded Golem pallet speed boost on concrete and industrial floors
        run: python3 scripts/warehouse_concrete_carry_speed_smoke.py
      - name: Verify courier avoids nearby pallet decks and retains its assigned target
        run: python3 scripts/warehouse_nearby_pallet_courier_smoke.py
      - name: Verify remote handoff transitions and connected carrying arm joints
        run: python3 scripts/warehouse_remote_handoff_arms_smoke.py
      - name: Verify connected PVC curtain barrier and remote pickup placement handoff
        run: python3 scripts/plastic_curtains_remote_handoff_smoke.py
      - name: Verify stairs, rack ladder and folding scaffolding safety railings
        run: python3 scripts/warehouse_rack_access_equipment_smoke.py
      - name: Verify intact pallet death recovery and scanner mode swapping
        run: python3 scripts/warehouse_pallet_death_recovery_smoke.py
      - name: Verify idle golem arms, repaired UV atlas and smooth slab traversal
        run: python3 scripts/warehouse_idle_slab_texture_smoke.py
      - name: Verify Recall ground pallet drop and preserved 216-slot cargo
        run: python3 scripts/warehouse_recall_ground_delivery_smoke.py
      - name: Verify visible remote empty pallet and safe direct scanner Golem recall
        run: python3 scripts/warehouse_remote_pallet_visual_direct_recall_smoke.py
      - name: Verify unloading Golems hold actual items in wrists with no cargo tray
        run: python3 scripts/warehouse_golem_handheld_item_smoke.py
      - name: Verify named Golems and Rack Computer debug toggles
        run: python3 scripts/warehouse_golem_names_debug_smoke.py
      - name: Verify Direct scanner recalls all personal followers without Rack Computer proximity
        run: python3 scripts/warehouse_personal_direct_recall_smoke.py
      - name: Verify Golems physically swim across water and can rendezvous at waterline
        run: python3 scripts/warehouse_remote_water_navigation_smoke.py
      - name: Verify full-size 12-pallet tower, height collision and hand retrieval
        run: python3 scripts/warehouse_fullsize_pallet_stack_regression.py
      - name: Verify Scanner Remote/Direct mode isolation and computer diagnostics
        run: python3 scripts/warehouse_scanner_mode_interactions_smoke.py
      - name: Verify Direct summon selects four closest eligible linked warehouse Golems
        run: python3 scripts/warehouse_direct_four_nearest_golems_smoke.py
      - name: Verify Direct crew recall, remote transport visuals and stack pickup
        run: python3 scripts/warehouse_scanner_motion_stack_smoke.py
      - name: Verify Direct PTP rack-style handoffs and nonblocking pallet delivery
        run: python3 scripts/warehouse_ptp_rackstyle_direct_delivery_smoke.py
      - run: gradle build --stacktrace
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Caszual-Additions-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Publish GitHub package release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: Caszual Additions Dev Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
